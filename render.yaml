# Render Blueprint — deploys the Dash dashboard as a web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: monte-carlo-risk-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # app:server is the Flask WSGI app exposed by app.py; Render provides $PORT.
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
